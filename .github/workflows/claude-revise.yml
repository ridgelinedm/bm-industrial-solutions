# Comment "@claude <what to change>" on a ticket PR and Claude revises the
# branch, which refreshes the preview. The action itself ignores commenters
# without write access to the repo.
name: Claude revisions

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  revise:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event.issue.pull_request || github.event.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm run build:*),Bash(npm run check:*),Bash(git diff:*),Bash(git status:*)"
            --append-system-prompt "Follow CLAUDE.md. Run npm run build and npm run check after every change. Commit only source files; dist/ is build output and is never committed."
