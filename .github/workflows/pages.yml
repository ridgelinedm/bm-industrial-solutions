# Builds the Astro site and publishes it to GitHub Pages
# (https://ridgelinedm.github.io/bm-industrial-solutions/).
#
# Runs on every push to main. Ticket deploys merge with the workflow token,
# which does not fire push events, so ticket-deploy.yml starts this by hand.
# Canonicals and the sitemap point at the real domain.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        env:
          SITE_URL: https://www.bmindustrialsolutionsllc.com
          BASE_PATH: /bm-industrial-solutions
        run: |
          npm ci --no-audit --no-fund
          npx astro build
          python3 _build/check.py --root dist --base "$BASE_PATH"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
